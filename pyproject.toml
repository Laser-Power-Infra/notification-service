[project]
name = "notifier"
version = "0.1.0"
description = "RabbitMQ to Telegram notification service"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: needs RabbitMQ at AMQP_URL (docker compose up -d rabbitmq)"]

# RabbitMQ is not defined here: the worker and API use the shared one from the infrastructure repo
# (container rabbitmq-prod on the external "infra" network). Start infrastructure first.
services:
  notifier:
    build: .
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq-prod:5672/
      LOG_LEVEL: INFO
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      EVOLUTION_URL: http://evolution-api:6026
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    depends_on:
      evolution-api:
        condition: service_started
    networks: [default, infra]
    restart: unless-stopped

  api:
    build: .
    command: ["uv", "run", "--no-sync", "uvicorn", "notifier.api:app", "--host", "0.0.0.0", "--port", "6025"]
    environment:
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://192.168.1.190:6026,http://127.0.0.1:6026,http://localhost:6026
      AMQP_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq-prod:5672/
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      EVOLUTION_URL: http://evolution-api:6026
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    ports:
      - "6025:6025"
    networks: [default, infra]
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    environment:
      SERVER_URL: http://localhost:6026
      SERVER_PORT: "6026"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "6026:6026"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    restart: unless-stopped

  evolution-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  evolution-redis:
    image: redis:7
    volumes:
      - evolution_redis:/data
    restart: unless-stopped

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:

networks:
  infra:
    external: true
